name: Sync upstream

# Merges PixelPlayerHQ/PixelPlayerOSS into main once a week so our delta stays a
# reviewable merge instead of a 500-commit avalanche. Trigger it by hand any time with
# the "Run workflow" button; nothing lands on main without review.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/PixelPlayerHQ/PixelPlayerOSS.git
          git fetch upstream --tags
          git log --oneline HEAD..upstream/main | head -20

      - name: Merge upstream
        id: merge
        run: |
          set -eu
          count=$(git rev-list --count HEAD..upstream/main)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "Nothing new upstream."
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c sync/upstream
          if git merge --no-edit upstream/main; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflict-files.txt
            git merge --abort
          fi

      - name: Push sync branch
        if: steps.merge.outputs.count != '0' && steps.merge.outputs.conflicts == 'false'
        run: git push --force origin sync/upstream

      - name: Open or refresh pull request
        if: steps.merge.outputs.count != '0' && steps.merge.outputs.conflicts == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          open=$(gh pr list --head sync/upstream --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh pr create --base main --head sync/upstream \
              --title "Sync with upstream ($(date -u +%Y-%m-%d))" \
              --body "Weekly merge of PixelPlayerHQ/PixelPlayerOSS into main. Review the diff, wait for the debug build, then merge."
          else
            echo "Existing sync pull request refreshed by the force push."
          fi

      # A pull request opened with GITHUB_TOKEN does not start other workflows (GitHub
      # suppresses those runs to avoid recursion), so kick the build off explicitly.
      - name: Build the sync branch
        if: steps.merge.outputs.count != '0' && steps.merge.outputs.conflicts == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --ref sync/upstream

      - name: Report conflicts
        if: steps.merge.outputs.count != '0' && steps.merge.outputs.conflicts == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          {
            echo "Merging PixelPlayerHQ/PixelPlayerOSS into main conflicts in these files:"
            echo
            sed "s/^/- /" conflict-files.txt
            echo
            echo "Resolve locally:"
            echo
            echo "```"
            echo "git fetch upstream"
            echo "git switch -c sync/upstream main"
            echo "git merge upstream/main"
            echo "```"
          } > conflict-body.md
          gh issue create \
            --title "Upstream sync needs manual resolution ($(date -u +%Y-%m-%d))" \
            --body-file conflict-body.md