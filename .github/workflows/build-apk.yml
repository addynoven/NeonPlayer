name: Build debug APK

# Compiles the app on every push to main and on pull requests, so a bad upstream merge
# is caught by the compiler instead of by your phone. The APK is attached as an
# artifact you can download and install directly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu runner image already ships the Android SDK with accepted
      # licenses; android-actions/setup-android@v3 dies on the retired "tools"
      # package, so let AGP resolve whatever platform compileSdk asks for.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: neonplayer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error